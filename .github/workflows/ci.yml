name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: SSH and SFTP integration tests
        run: npm run test:ssh && npm run test:ssh:sftp
      - name: Pack plugin tarball
        run: npm run pack
